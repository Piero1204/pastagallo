<style>
.mx-f{display:grid;gap:4px;font-size:12px;color:var(--gris);font-weight:600}
.mx-f input,.mx-f select,.mx-f textarea{font:inherit;color:var(--tinta);font-weight:400;padding:10px;min-height:44px;border:1px solid var(--linea);border-radius:8px;background:#fff;width:100%}
.mx-f input:focus,.mx-f select:focus,.mx-f textarea:focus{outline:2px solid var(--oro2);border-color:var(--oro2)}
.mx-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;align-items:end}
.mx-card{background:#fff;border:1px solid var(--linea);border-left:6px solid var(--linea);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;box-shadow:0 1px 3px rgba(60,30,20,.06)}
.mx-card.bajo{border-left-color:var(--ambar);background:#fffaf0}.mx-card.negativo{border-left-color:var(--mal);background:#fff3f1}.mx-card.ok{border-left-color:var(--ok)}
.mx-card.inactivo{opacity:.6}
.mx-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.mx-top b{font:700 19px var(--serif);color:var(--vino)}
.mx-big{font:700 24px var(--serif)}
.mx-acc{display:flex;flex-wrap:wrap;gap:6px}.mx-acc .btn{min-height:44px;padding:8px 14px;font-size:14px}
.mx-aviso{border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-weight:600;background:#fff3f1;border:1px solid #efc2bd;color:#7a1d16}
.mx-aviso.suave{background:#fff6dc;border-color:#ecd28c;color:#5b4210}
.mx-panel{background:var(--papel);border:2px solid var(--oro2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mx-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mx-chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:#f1ece2;color:var(--gris)}
.mx-chip.bajo{background:#fbe8c3;color:#7a4a05}.mx-chip.negativo{background:#f6d0cc;color:#8a1d15}.mx-chip.ok{background:#dcefe2;color:#1d5c37}
.mx-interruptor{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600}.mx-interruptor input{width:22px;height:22px}
.mx-del{font:700 18px var(--sans);color:var(--mal);background:none;border:1px solid var(--linea);border-radius:8px;min-width:44px;min-height:44px}
</style>
<section class="vista" id="v-inventario">
  <h2 class="tit">Inventario e insumos</h2>
  <div id="invRaiz"><div class="vacio">Cargando…</div></div>
</section>
