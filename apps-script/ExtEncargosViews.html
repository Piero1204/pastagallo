<style>
.ec-f{display:grid;gap:4px;font-size:12px;color:var(--gris);font-weight:600}
.ec-f input,.ec-f select,.ec-f textarea{font:inherit;color:var(--tinta);font-weight:400;padding:10px;min-height:44px;border:1px solid var(--linea);border-radius:8px;background:#fff;width:100%}
.ec-f input:focus,.ec-f select:focus,.ec-f textarea:focus{outline:2px solid var(--oro2);border-color:var(--oro2)}
.ec-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;align-items:end}
.ec-it{display:grid;grid-template-columns:3fr 1fr 1.2fr auto;gap:8px;margin-bottom:8px;align-items:center}
.ec-card{background:#fff;border:1px solid var(--linea);border-left:6px solid var(--gris);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;box-shadow:0 1px 3px rgba(60,30,20,.06)}
.ec-card.e-Cotizado{border-left-color:#8a7f78}.ec-card.e-Confirmado{border-left-color:var(--azul)}.ec-card.e-En-preparación{border-left-color:var(--ambar)}
.ec-card.e-Listo{border-left-color:var(--morado)}.ec-card.e-Entregado{border-left-color:var(--ok)}.ec-card.e-Cancelado{border-left-color:var(--mal);opacity:.65}
.ec-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ec-top b{font:700 19px var(--serif);color:var(--vino)}
.ec-chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:#f1ece2;color:var(--gris)}
.ec-chip.deb{background:#fbe8c3;color:#7a4a05}
.ec-dia{font:600 21px var(--serif);color:var(--vino);margin:14px 0 6px;text-transform:capitalize}
.ec-acc{display:flex;flex-wrap:wrap;gap:6px}.ec-acc .btn{min-height:44px;padding:8px 14px;font-size:14px}
.ec-panel{background:var(--papel);border:2px solid var(--oro2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ec-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.ec-tot{font:700 22px var(--serif);text-align:right}
.ec-del{font:700 18px var(--sans);color:var(--mal);background:none;border:1px solid var(--linea);border-radius:8px;min-width:44px;min-height:44px}
.ec-aviso{border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-weight:600;background:#fff6dc;border:1px solid #ecd28c;color:#5b4210}
@media (max-width:640px){.ec-it{grid-template-columns:1fr 1fr 1fr auto}.ec-it>:first-child{grid-column:1/-1}}
/* ficha imprimible */
#ecImp{display:none}
#ecImp.on{display:block;position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;padding:18px}
#ecImp .ec-ficha{max-width:720px;margin:0 auto;font:15px/1.5 var(--sans);color:#000}
#ecImp h1{font:600 30px var(--serif);margin:0 0 2px}
#ecImp table{width:100%;border-collapse:collapse;margin:10px 0}#ecImp td,#ecImp th{border-bottom:1px solid #999;padding:6px 4px;text-align:left}
#ecImp .num{text-align:right}
@media print{body>*:not(#ecImp){display:none!important}#ecImp.on{position:static;padding:0}#ecImp .no-imp{display:none!important}}
</style>
<section class="vista" id="v-encargos">
  <h2 class="tit">Encargos, mayoristas y envíos</h2>
  <div id="ecRaiz"><div class="vacio">Cargando…</div></div>
</section>
