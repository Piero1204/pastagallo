<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a1519">
<title>Pasta Gallo · Tu opinión</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  body{margin:0;background:#f7f1e3;color:#2b1d1a;font:17px/1.5 Georgia,serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
  main{background:#fff;border:1px solid #e5d9bd;border-radius:14px;max-width:420px;width:100%;padding:26px 22px;text-align:center}
  h1{color:#4a1519;font-size:24px;margin:0 0 6px}
  p{margin:6px 0 14px}
  .est{display:flex;justify-content:center;gap:6px;margin:14px 0}
  .est button{background:none;border:0;font-size:44px;line-height:1;color:#cdbf9c;padding:4px 6px;cursor:pointer}
  .est button.on{color:#c9a227}
  textarea{width:100%;box-sizing:border-box;border:1px solid #d8cdb4;border-radius:10px;padding:10px;font:inherit;min-height:90px}
  .env{margin-top:14px;background:#4a1519;color:#fff;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:700;width:100%;cursor:pointer}
  .env[disabled]{opacity:.5}
  .hp{position:absolute;left:-9999px}
  #msg{margin-top:12px;min-height:1.4em}
</style>
</head>
<body>
<main>
  <h1>¿Cómo estuvo tu pedido?</h1>
  <p>Tu opinión nos ayuda a mejorar. Toma menos de un minuto.</p>
  <div class="est" id="est" role="radiogroup" aria-label="Calificación de 1 a 5 estrellas"></div>
  <textarea id="com" maxlength="500" placeholder="Cuéntanos más (opcional)" aria-label="Comentario"></textarea>
  <input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="env" id="env" disabled>Enviar opinión</button>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<script src="menu-data.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), p = q.get("p") || "", k = q.get("k") || "", n = 0;
  var api = window.CARTA && window.CARTA.pedidos && window.CARTA.pedidos.api;
  var cont = document.getElementById("est"), env = document.getElementById("env"), msg = document.getElementById("msg");
  for (var i = 1; i <= 5; i++) (function (v) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = "★"; b.setAttribute("role", "radio"); b.setAttribute("aria-label", v + (v === 1 ? " estrella" : " estrellas"));
    b.onclick = function () { n = v; env.disabled = false; Array.prototype.forEach.call(cont.children, function (x, j) { x.classList.toggle("on", j < v); x.setAttribute("aria-checked", j === v - 1 ? "true" : "false"); }); };
    cont.appendChild(b);
  })(i);
  if (!api || !p || !k) { env.style.display = "none"; msg.textContent = "Este enlace no es válido."; return; }
  env.onclick = function () {
    env.disabled = true; msg.textContent = "Enviando...";
    fetch(api, { method: "POST", body: JSON.stringify({ ext: "clientes", accion: "opinar", p: p, k: k, estrellas: n, comentario: document.getElementById("com").value, web: document.getElementById("web").value }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.ok) { document.querySelector("main").innerHTML = "<h1>¡Gracias!</h1><p>Recibimos tu opinión.</p>"; } else { msg.textContent = (r && r.error) || "No se pudo enviar. Intenta de nuevo."; env.disabled = false; } })
      .catch(function () { msg.textContent = "No se pudo enviar. Revisa tu conexión."; env.disabled = false; });
  };
})();
</script>
</body>
</html>
